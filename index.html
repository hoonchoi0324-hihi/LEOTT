<style>
/* 한밤의 집: 어두운 남보라 바탕 + 스탠드 불빛 주황 + 래오 털색 노랑. 화면 하나에 게임판, 위에 HUD, 아래에 터치 패드 */
:root{
  color-scheme:dark;
  --night:#15121f;
  --panel:#211c31;
  --line:#3a3254;
  --ink:#f3ead8;
  --dim:#a99fc0;
  --lamp:#ffc96b;
  --leo:#d9a441;
  --danger:#ff6b5a;
  --ok:#7fd49a;
  --f-ui:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-px:'DotGothic16','Jua',ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;background:var(--panel);border:3px solid var(--line);padding:8px 12px}
.hud-l{display:flex;align-items:baseline;gap:12px}
#dayName{font-size:20px;color:var(--lamp)}
.px{font-family:var(--f-px);font-variant-numeric:tabular-nums}
#clock{font-size:20px;letter-spacing:.04em}
.hud-r{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px}
.lbl{color:var(--dim);font-size:14px}
.pips{display:flex;gap:3px}
.pip{width:12px;height:12px;background:#2c2640;border:2px solid #4a4068}
.pip.on{background:var(--danger);border-color:#ffb3a8}
.stage{position:relative}
canvas#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:3px solid var(--line);box-sizing:border-box;touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,16,32,.88);border:2px solid var(--lamp);color:var(--lamp);padding:5px 12px;font-size:15px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(9,7,16,.82);display:flex;align-items:center;justify-content:center;z-index:20;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:0 0 0 4px #0b0912,0 0 40px rgba(255,201,107,.12);max-width:520px;width:100%;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.box h1{font-size:44px;margin:0;color:var(--lamp);letter-spacing:.02em;text-wrap:balance;text-shadow:3px 3px 0 #5a3a12}
.box h2{font-size:28px;margin:0;color:var(--lamp);text-wrap:balance}
.box p{margin:0;line-height:1.6;color:var(--ink)}
.box .sub{color:var(--dim);font-size:15px}
.story p{opacity:0;animation:fadeIn .6s forwards}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.story p{animation:none;opacity:1}}
.rules{background:#181427;border:2px dashed var(--line);padding:10px 12px;text-align:left;font-size:15px;line-height:1.7;color:var(--dim)}
.rules b{color:var(--ink);font-weight:normal}
.keys{display:inline-block;font-family:var(--f-px);background:#2c2640;border:2px solid #4a4068;padding:0 5px;color:var(--ink);font-size:13px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font-family:var(--f-ui);font-size:18px;color:#2a1a06;background:var(--lamp);border:0;box-shadow:inset -3px -3px 0 #c98a2a,0 4px 0 #6b4512;padding:10px 22px;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 #c98a2a,0 2px 0 #6b4512}
button.ghost{background:#2c2640;color:var(--ink);box-shadow:inset -3px -3px 0 #1b1729,0 4px 0 #0b0912}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hero-cv{width:180px;max-width:100%;height:auto;margin:0 auto;image-rendering:pixelated;display:block}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .v{font-family:var(--f-px);font-size:26px;color:var(--lamp)}
.stars{font-size:28px;letter-spacing:6px;color:var(--lamp)}
.credit{font-family:var(--f-px);color:var(--dim);font-size:14px;letter-spacing:.1em}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
body.touch .pad{display:flex}
@media (pointer:coarse){.pad{display:flex}.help{display:none}}
.joy{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#2c2640 0 55%,#221d33 56%);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;touch-action:none;flex:none}
.knob{width:56px;height:56px;border-radius:50%;background:var(--leo);box-shadow:inset -4px -4px 0 #a8702e,0 3px 0 #5a3a12;pointer-events:none}
canvas#cv{cursor:pointer}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-pick label{cursor:pointer}
.role-pick input{position:absolute;opacity:0;pointer-events:none}
.role-pick span{display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:#181427;border:3px solid var(--line);font-size:20px}
.role-pick small{font-size:13px;color:var(--dim)}
.role-pick input:checked+span{border-color:var(--lamp);color:var(--lamp);background:#2a2238}
.role-pick input:focus-visible+span{outline:3px solid #fff;outline-offset:2px}
.code-in{font-family:var(--f-px);font-size:24px;text-align:center;letter-spacing:.3em;padding:10px;background:#181427;color:var(--ink);border:3px solid var(--line);width:100%;box-sizing:border-box}
.code-in:focus{outline:none;border-color:var(--lamp)}
.code{font-family:var(--f-px);font-size:56px;letter-spacing:.2em;color:var(--lamp);text-shadow:3px 3px 0 #5a3a12}
.acts{display:flex;gap:12px}
.acts button{width:84px;height:84px;padding:0;border-radius:50%;font-size:20px;position:relative;overflow:hidden;touch-action:none}
#bShout{background:var(--danger);color:#fff;box-shadow:inset -4px -4px 0 #b8402f,0 4px 0 #5a1a12}
#bShout::after{content:"";position:absolute;inset:0;background:rgba(10,8,18,.6);transform:scaleY(var(--cd,0));transform-origin:bottom}
.help{margin:0;color:var(--dim);font-size:14px;line-height:1.7;text-align:center}
</style>

<div class="wrap">
  <header class="hud">
    <div class="hud-l"><span id="dayName">첫째 밤</span><span id="clock" class="px">22:00</span></div>

</div>

<div id="ov" class="ov"><div class="box" id="box"></div></div>

<script>
/* ===== 파이어베이스 설정 (LEOTT 프로젝트) =====
   Realtime Database만 쓰기 때문에 databaseURL만 맞으면 된다.
   데이터 화면 맨 위 주소가 아래와 다르면 databaseURL만 그 주소로 바꾸면 된다. */
const FIREBASE_CONFIG={
  projectId:"leott-f7e85",
  authDomain:"leott-f7e85.firebaseapp.com",
  databaseURL:"https://leott-f7e85-default-rtdb.asia-southeast1.firebasedatabase.app"
};
(()=>{
const S=3,T=16,W=20,H=13,VW=W*T,VH=H*T;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------- 지도 ---------- */
const MAP=[
"####################",
"#SSS.....#BBB......#",
"#........#BBB......#",
"#..................#",
"#...TT...#.........#",
"#........#.........#",
"####.#########.#####",
"#..................#",
"#........#....KKKK.#",
"#..................#",
"#........#.........#",
"#........#..TT.....#",
"####################"];
const ENTRIES=[
  {name:'현관문',bx:4,by:12,ix:4,iy:11,kind:'door'},
  {name:'개구멍',bx:15,by:0,ix:15,iy:1,kind:'flap'},
  {name:'왼쪽 창문',bx:0,by:3,ix:1,iy:3,kind:'win'},
  {name:'오른쪽 창문',bx:19,by:9,ix:18,iy:9,kind:'win'},
];
const isEntry=(x,y)=>ENTRIES.some(e=>e.bx===x&&e.by===y);
const walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(MAP[y][x]==='.'||isEntry(x,y));
const room=(x,y)=>y<6?(x<9?'living':'bed'):(x<9?'hall':'kitchen');

/* ---------- 픽셀 그림 ---------- */
function sprite(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1);}});
  return c;
}
const K='#22161a';
const DOG_A=[
"..........kk...",
".........kbbk..",
"........kyyyyk.",
"........kyykyyk",
"k.......kyyyyyn",
"yk.kkkkkkcyywwk",
".kyyyyyyyyykk..",
".kyyyyyyyyyk...",
"..kyk..kyk.....",
"..kk...kk......"];
const DOG_B=DOG_A.slice(0,4).concat([
"........kyyyyyn",
"kk.kkkkkkcyywwk",
".kyyyyyyyyykk..",
".kyyyyyyyyyk...",
".kyk....kyk....",
".kk.....kk....."]);
// 래오: 골든리트리버 (축 늘어진 귀 + 복슬한 꼬리 + 배 아래 깃털)
const GOLD_TOP=[
"...........kkkk...",
"..........kyyyyk..",
".........kbyyyykkk",
".........kbyykyyyk"];
const GOLD_A=GOLD_TOP.concat([
"k........kbbyyywwn",
"yk.......kbbyywwwk",
"fyk.kkkkkkbbkyykk.",
".fkyyyyyyyyyyyyk..",
"..kyyyyyyyyyyyyk..",
"..kfyyyyyyyyyyfk..",
"...kyk......kyk...",
"...kk.......kk...."]);
const GOLD_B=GOLD_TOP.concat([
".........kbbyyywwn",
"kk.......kbbyywwwk",
"fyk.kkkkkkbbkyykk.",
".fkyyyyyyyyyyyyk..",
"..kyyyyyyyyyyyyk..",
"..kfyyyyyyyyyyfk..",
"..kyk........kyk..",
"..kk.........kk..."]);
const DOGS=[
  {name:'래오',rows:[GOLD_A,GOLD_B],pal:{k:'#3a2410',y:'#e2a94c',b:'#b8782a',w:'#f6d995',f:'#f6d995',n:'#1a0e08'}},
  {name:'똘이',rows:[DOG_A,DOG_B],pal:{k:'#3a3036',y:'#ece6d8',b:'#c9b8a0',w:'#ffffff',n:'#1a1416',c:'#3b82c4'}},
  {name:'까망이',rows:[DOG_A,DOG_B],pal:{k:'#a497bd',y:'#3d3644',b:'#2a2430',w:'#8a7f90',n:'#000000',c:'#e3b341'}},
];
DOGS.forEach(d=>{d.sa=sprite(d.rows[0],d.pal);d.sb=sprite(d.rows[1],d.pal);});

const PL={h:'#3b2a20',s:'#f1c7a0',k:'#1b1420',p:'#e88a8a',b:'#5b8fd6',w:'#cfe0ff'};
const P_TOP=["...hhhh...","..hhhhhh..",".hhsssshh.","..skssks..","..psssps..","...ssss...","..bbbbbb..",".sbwbbwbs.",".sbbbbbbs.","..bwbbwb..","..bbbbbb.."];
const P_A=sprite(P_TOP.concat(["..bb..bb..","..bb..bb..","..kk..kk.."]),PL);
const P_B=sprite(P_TOP.concat(["..bb.bb...","..bb..bb..",".kk...kk.."]),PL);

const ITEMS=[
 {key:'shoe',name:'운동화',x:2,y:10,fluff:'#f4f0e8',pal:{k:K,r:'#d8473b',w:'#f4f0e8'},rows:[
  "..........","..........","...kkk....","..krrrk...","..krwrrk..",".krrrrrrkk","krrrrrrrrk","kwwwwwwwwk",".kkkkkkkk.",".........."]},
 {key:'slip',name:'슬리퍼',x:6,y:11,fluff:'#e6c27a',pal:{k:K,y:'#f2c94c',f:'#c9a46a'},rows:[
  "..........","..kk..kk..",".kyyk.kyyk",".kyyk.kyyk",".kffk.kffk",".kffk.kffk",".kffk.kffk",".kffk.kffk","..kk...kk.",".........."]},
 {key:'teddy',name:'곰인형',x:4,y:1,fluff:'#d9b38c',pal:{k:K,b:'#a0683a',l:'#d9b38c',n:'#2a1810'},rows:[
  ".kk....kk.","kbbk..kbbk","kbbbkkbbbk",".kbbbbbbk.",".kbkbbkbk.",".kbbnnbbk.","..kbbbbk..",".kbbllbbk.","kbbbllbbbk",".kkk..kkk."]},
 {key:'cushion',name:'쿠션',x:2,y:3,fluff:'#f7b3c8',pal:{k:K,p:'#e87fa0',q:'#ffd0de'},rows:[
  "..........",".k......k.","kpkkkkkkpk","kppppppppk","kpppqqpppk","kppqppqppk","kpppqqpppk","kppppppppk","kpkkkkkkpk",".k......k."]},
 {key:'remote',name:'리모컨',x:6,y:5,fluff:'#555a66',pal:{k:K,d:'#3b3f4a',r:'#e04a3a',g:'#9aa3b5'},rows:[
  "...kkkk...","...kddk...","...kdrk...","...kddk...","...kgdk...","...kdgk...","...kgdk...","...kddk...","...kddk...","...kkkk..."]},
 {key:'pillow',name:'베개',x:11,y:3,fluff:'#ffffff',pal:{k:K,w:'#f2f0f8',c:'#c7c3d8'},rows:[
  "..........","..........",".kkkkkkkk.","kwwwwwwwwk","kwwwwwwwck","kwwwwwwwwk","kcwwwwwwwk",".kkkkkkkk.","..........",".........."]},
 {key:'socks',name:'양말',x:17,y:5,fluff:'#7fd49a',pal:{k:K,g:'#4fae6e',w:'#f4f0e8'},rows:[
  "...kkk....","..kgggk...","..kwwwk...","..kgggk...","..kwwwk...","..kgggk...","..kgggkk..","..kgggggk.","...kgggggk","....kkkkk."]},
 {key:'tissue',name:'휴지',x:16,y:10,fluff:'#ffffff',pal:{k:K,w:'#f6f4ee'},rows:[
  "..........","..kkkkk...",".kwwwwwk..","kwwkkkwwk.","kwwk.kwwk.","kwwkkkwwkk",".kwwwwwwwk","..kkkkkwwk","......kwwk",".......kk."]},
];
ITEMS.forEach(it=>it.img=sprite(it.rows,it.pal));
const BONE=sprite(["k.....k","wk...kw",".kwwwk.","wk...kw","k.....k"].map(r=>r.replace(/k/g,'q')),{q:'#5a4630',w:'#f6ecd2'});

/* ---------- 고정 배경 미리 그리기 ---------- */
const bg=document.createElement('canvas');bg.width=VW;bg.height=VH;
(function drawBG(){
  const g=bg.getContext('2d');
  const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  function floor(x,y){
    const px=x*T,py=y*T,r=room(x,y);
    if(r==='living'){R('#6a4a33',px,py,T,T);for(let i=0;i<4;i++){R('#563b28',px,py+i*4+3,T,1);R('#563b28',px+((y*4+i)*5+x*3)%16,py+i*4,1,3);}}
    else if(r==='bed'){R('#3e4a72',px,py,T,T);R('#4a578a',px+3,py+5,1,1);R('#4a578a',px+11,py+12,1,1);R('#36406a',px+8,py+1,1,1);}
    else if(r==='hall'){R('#57545e',px,py,T,T);R('#47444f',px+15,py,1,T);R('#47444f',px,py+15,T,1);R('#625f6a',px+1,py+1,6,1);}
    else {for(let i=0;i<2;i++)for(let j=0;j<2;j++)R(((i+j+x+y)%2)?'#b9ad98':'#8c8070',px+i*8,py+j*8,8,8);}
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=MAP[y][x],px=x*T,py=y*T;
    if(c==='#'){
      R('#231e34',px,py,T,T);R('#2b2540',px,py,T,2);
      if(y+1<H&&MAP[y+1][x]!=='#'){R('#3a3157',px,py+10,T,6);R('#51477a',px,py+10,T,1);}
      continue;
    }
    floor(x,y);
    if(c==='S'){
      R('#7d3546',px,py+1,T,8);R('#a2475b',px,py+8,T,7);R('#5e2634',px,py+15,T,1);R('#8f4052',px,py+2,T,1);
      if(MAP[y][x-1]!=='S')R('#6b2c3c',px,py+4,3,12);
      if(MAP[y][x+1]!=='S')R('#6b2c3c',px+13,py+4,3,12);
    } else if(c==='B'){
      R('#5c3f2b',px,py,T,T);R('#3f6fae',px+1,py,14,T);
      if(MAP[y-1][x]!=='B'){R('#cfd6e8',px+1,py,14,9);R('#f4f2fa',px+3,py+2,10,5);R('#5f8fd0',px+1,py+9,14,1);}
      else{R('#4c7cbc',px+1,py+4,14,1);R('#4c7cbc',px+1,py+10,14,1);R('#5c3f2b',px,py+14,T,2);}
    } else if(c==='T'){
      R('#8a5d38',px+1,py+3,14,9);R('#a87447',px+1,py+3,14,2);R('#5a3a22',px+2,py+12,2,3);R('#5a3a22',px+12,py+12,2,3);
    } else if(c==='K'){
      R('#575a66',px,py,T,T);R('#9a9dab',px,py,T,10);R('#b5b8c4',px,py,T,1);R('#444650',px,py+15,T,1);
      if(x===15){R('#2b2d35',px+2,py+2,5,5);R('#2b2d35',px+9,py+2,5,5);R('#d8473b',px+4,py+4,1,1);}
      if(x===17){R('#4f6f86',px+2,py+2,12,6);R('#7fa3bd',px+2,py+2,12,1);}
      R('#6a6d79',px+7,py+11,2,2);
    }
  }
  // 문, 창문, 개구멍
  ENTRIES.forEach(e=>{
    const px=e.bx*T,py=e.by*T;
    if(e.kind==='door'){R('#6b4529',px+1,py,14,T);R('#8a5a34',px+2,py+1,12,14);R('#5a3a22',px+7,py+1,1,14);R('#f2c94c',px+11,py+7,2,2);}
    if(e.kind==='win'){R('#8a7a60',px+2,py+1,12,14);R('#1d3157',px+3,py+2,10,12);R('#2c4a7a',px+3,py+2,10,5);R('#8a7a60',px+7,py+2,2,12);R('#8a7a60',px+3,py+7,10,2);R('#f4ecc8',px+4,py+3,2,2);}
    if(e.kind==='flap'){R('#0d0b14',px+4,py+6,8,10);R('#0d0b14',px+5,py+5,6,1);R('#7a5a3a',px+4,py+7,8,8);R('#5a3f28',px+4,py+7,8,1);}
  });

/* ---------- 길찾기 ---------- */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(sx,sy,tx,ty){
  const key=(x,y)=>y*W+x,prev=new Int32Array(W*H).fill(-2);
  const q=[key(sx,sy)];prev[key(sx,sy)]=-1;let h=0;const goal=key(tx,ty);
  while(h<q.length){const k=q[h++];if(k===goal)break;const x=k%W,y=(k/W)|0;
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=key(nx,ny);
      if(prev[nk]!==-2)continue;if(!walk(nx,ny))continue;prev[nk]=k;q.push(nk);}}
  if(prev[goal]===-2)return null;
  const p=[];let k=goal;while(k!==-1){p.push({x:k%W,y:(k/W)|0});k=prev[k];}
  return p.reverse();
}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='square',v=.05,slide=0,when=0){
  if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);
}

  broke(){tone(240,.3,'square',.06,-170)},
  treat(){tone(760,.06,'triangle',.05,240);tone(980,.06,'triangle',.04,0,.07)},

/* ---------- 개 행동 ---------- */
const dogTile=d=>({x:Math.floor(d.x/T),y:Math.floor(d.y/T)});
function setPath(d,tx,ty){const s=dogTile(d);const p=findPath(s.x,s.y,tx,ty);d.path=p||[];d.pi=0;return !!p;}
function pickTarget(d){
  d.state='walk';
  if(G.floorTreats.length){
    const s=dogTile(d);let best=null,bd=1e9;
    for(const tr of G.floorTreats){const dd=Math.abs(tr.x-s.x)+Math.abs(tr.y-s.y);if(dd<bd){bd=dd;best=tr;}}
    d.target={type:'treat',ref:best};setPath(d,best.x,best.y);return;
  }
  const alive=G.items.filter(it=>!it.dead);
  if(!alive.length){d.target=null;d.path=[];return;}
  const free=alive.filter(it=>!G.dogs.some(o=>o!==d&&o.target&&o.target.ref===it));
  const pool=free.length?free:alive;
  const it=pool[Math.floor(Math.random()*pool.length)];
  d.target={type:'item',ref:it};setPath(d,it.x,it.y);
}
function follow(d,sp,dt){
  if(!d.path||d.pi>=d.path.length)return true;
  const n=d.path[d.pi],tx=n.x*T+8,ty=n.y*T+11,dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy),step=sp*dt;
  if(Math.abs(dx)>.3)d.face=dx<0?-1:1;d.anim+=dt*9;
  if(dist<=step){d.x=tx;d.y=ty;d.pi++;return d.pi>=d.path.length;}
  d.x+=dx/dist*step;d.y+=dy/dist*step;return false;
}
function flee(d){
  const s=dogTile(d);let best=null;
  for(const ei of DAYS[G.day].entries){const e=ENTRIES[ei];const p=findPath(s.x,s.y,e.bx,e.by);if(p&&(!best||p.length<best.length))best=p;}
  d.path=best||[];d.pi=0;d.state='flee';d.target=null;
}
function spawn(d){
  const day=DAYS[G.day];
  const used=G.dogs.filter(o=>o!==d&&(o.state==='warn')).map(o=>o.entry);
  const opts=day.entries.filter(i=>!used.includes(i));
  const ei=opts[Math.floor(Math.random()*opts.length)];const e=ENTRIES[ei];
  d.entry=ei;d.x=e.bx*T+8;d.y=e.by*T+11;d.state='warn';d.timer=day.warn;d.path=[];
  SFX.bark();toast(`${e.name}에서 ${d.name} 소리가 난다!`);
}
function updateDog(d,dt){
  const day=DAYS[G.day];
  switch(d.state){
    case 'away':d.timer-=dt;if(d.timer<=0)spawn(d);break;
    case 'warn':d.timer-=dt;if(d.timer<=0){pickTarget(d);floatText(d.x,d.y-12,'멍!','#ffc96b');}break;
    case 'walk':{
      if(d.target&&d.target.type==='item'&&d.target.ref.dead){pickTarget(d);break;}
      if(d.target&&d.target.type==='treat'&&!G.floorTreats.includes(d.target.ref)){pickTarget(d);break;}
      if(!d.target){d.anim+=dt*3;if(Math.random()<dt)pickTarget(d);break;}
      if(follow(d,day.walk,dt)){
        if(d.target.type==='treat'){const i=G.floorTreats.indexOf(d.target.ref);if(i>=0){G.floorTreats.splice(i,1);d.state='eat';d.timer=3.2;floatText(d.x,d.y-12,'냠냠','#f6ecd2');}else pickTarget(d);}
        else d.state='chew';
      }
      break;}
    case 'chew':{
      const it=d.target&&d.target.ref;if(!it||it.dead){pickTarget(d);break;}
      it.hp-=day.chew*dt;d.anim+=dt*20;
      if(Math.random()<dt*10)G.parts.push({x:it.x*T+8+rand(-4,4),y:it.y*T+8,vx:rand(-25,25),vy:rand(-40,-10),life:.6,c:it.fluff});
      G.chewTick-=dt;if(G.chewTick<=0){SFX.chew();G.chewTick=.18;}
      if(it.hp<=0){it.hp=0;it.dead=true;G.broken++;G.totalBroken++;SFX.broke();floatText(it.x*T+8,it.y*T,it.name+' 망가짐!','#ff6b5a');toast(`${d.name}이(가) ${it.name}을(를) 물어뜯었다!`);
        if(G.broken>=3){failDay();return;}
        pickTarget(d);}
      break;}
    case 'eat':d.timer-=dt;d.anim+=dt*6;if(Math.random()<dt*2)floatText(d.x,d.y-12,'♥','#ff8fa8');if(d.timer<=0)pickTarget(d);break;
    case 'stun':d.timer-=dt;if(d.timer<=0){
      const it=d.target&&d.target.type==='item'&&d.target.ref,s=dogTile(d);
      if(it&&!it.dead&&s.x===it.x&&s.y===it.y)d.state='chew';else pickTarget(d);}break;
    case 'flee':if(follow(d,90,dt)){d.state='away';d.timer=rand(...day.respawn);}break;
  }
}

/* ---------- 행동 ---------- */

}
function throwTreat(){

/* ---------- 업데이트 ---------- */
function inputVec(p,dt){
  let mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0);
  if(joy.on&&(joy.x||joy.y)){mx=joy.x;my=joy.y;}
  if(mx||my){p.path=null;}
  else if(p.path){
    if(p.pi>=p.path.length)p.path=null;
    else{const n=p.path[p.pi],dx=n.x*T+8-p.x,dy=n.y*T+11-p.y,dd=Math.hypot(dx,dy);
      if(dd<1.5){p.pi++;}else{mx=dx/dd;my=dy/dd;}}
  }
  const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;}
  p.moving=len>.05;if(Math.abs(mx)>.2)p.face=mx<0?-1:1;if(p.moving)p.anim+=dt*9;
  return [mx,my];
}
function fx(dt){
  G.parts=G.parts.filter(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=120*dt;return q.life>0;});
  G.texts=G.texts.filter(q=>{q.life-=dt;q.y-=14*dt;return q.life>0;});
  G.rings=G.rings.filter(q=>{q.life-=dt;q.r+=110*dt;return q.life>0;});
}
function update(dt){
  if(G.mode!=='play')return;
  G.t+=dt;G.shoutCd=Math.max(0,G.shoutCd-dt);
  const p=G.player;const [mx,my]=inputVec(p,dt);
  tryMove(p,mx*70*dt,0);tryMove(p,0,my*70*dt);
  for(const d of G.dogs){
    updateDog(d,dt);if(G.mode!=='play')return;
    if(['walk','chew','stun','eat'].includes(d.state)&&Math.hypot(p.x-d.x,(p.y-5)-(d.y-3))<12){
      flee(d);G.shoo++;G.totalShoo++;SFX.shoo();floatText(d.x,d.y-12,'깨갱!','#7fd49a');
    }
  }
  fx(dt);
  if(G.t>=DUR)clearDay();
}
function solidAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=W||ty>=H)return true;return MAP[ty][tx]!=='.';}
const free=(x,y)=>!(solidAt(x-3,y-3)||solidAt(x+3,y-3)||solidAt(x-3,y+1)||solidAt(x+3,y+1));
function tryMove(p,dx,dy){
  if(!dx&&!dy)return;
  if(free(p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy;return;}
  // 모서리 보정: 문틈 근처에서 막히면 살짝 옆으로 밀어 준다
  const amt=Math.abs(dx||dy);
  for(let o=1;o<=8;o++)for(const s of[-1,1]){
    if(dx&&free(p.x+dx,p.y+s*o)&&free(p.x,p.y+s*Math.min(o,amt))){p.y+=s*Math.min(o,amt);return;}
    if(dy&&free(p.x+s*o,p.y+dy)&&free(p.x+s*Math.min(o,amt),p.y)){p.x+=s*Math.min(o,amt);return;}
  }
}

/* ---------- 그리기 ---------- */
const light=document.createElement('canvas');light.width=VW;light.height=VH;const lg=light.getContext('2d');
function drawSpr(img,x,y,flip,alpha=1){
  x=Math.round(x);y=Math.round(y);ctx.globalAlpha=alpha;
  if(flip){ctx.save();ctx.translate(x+img.width,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}
  else ctx.drawImage(img,x,y);ctx.globalAlpha=1;
}
function label(s,x,y,c,size=7){
  ctx.font=`${size}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.lineWidth=2;ctx.strokeStyle='#0b0912';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y);
}
let clock=0;
function draw(){
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;

    else{const shake=G.dogs.some(d=>d.state==='chew'&&d.target&&d.target.ref===it)?Math.round(Math.sin(clock*50)):0;drawSpr(it.img,x+shake,y);}
  });
  // 개와 주인 (y순)
  const ents=[];

  ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=false;

  G.dogs.forEach(d=>{if(d.state!=='warn')return;const e=ENTRIES[d.entry],px=e.bx*T,py=e.by*T,a=.3+.3*Math.sin(clock*14);
    ctx.fillStyle=`rgba(255,201,107,${a})`;ctx.fillRect(px,py,T,T);

  G.texts.forEach(q=>{ctx.globalAlpha=Math.min(1,q.life*2);label(q.s,q.x,q.y,q.c,7);ctx.globalAlpha=1;});
}
function drawDog(d){
  const img=(Math.floor(d.anim)%2)?d.sb:d.sa;let x=d.x-Math.floor(img.width/2),y=d.y-img.height+1;

const $=id=>document.getElementById(id);
const pips=[...document.querySelectorAll('.pip')];
function hud(){
  const net=G.mode==='net'||G.mode==='netEnd',dur=net?NET_DUR:DUR;
  $('dayName').textContent=net?`둘이 하기 · ${NET.role==='human'?'사람':'래오'}`:DAYS[G.day].name;
  const m=Math.floor(22*60+Math.min(G.t,dur)/dur*480)%1440;
  $('clock').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  pips.forEach((p,i)=>p.classList.toggle('on',i<G.broken));
  if(net&&NET.role==='dog'){$('treatsLbl').textContent='돌진';$('treats').textContent=NET.dashCd>0?NET.dashCd.toFixed(1):'OK';}
  else{$('treatsLbl').textContent='간식';$('treats').textContent=net?NET.treats:G.treats;}
  $('shoo').textContent=G.shoo;
  const cd=net?(NET.role==='human'?NET.shoutCd/2.5:0):G.shoutCd/2.5;
  $('bShout').style.setProperty('--cd',cd.toFixed(2));
}

/* ---------- 화면(오버레이) ---------- */
const ov=$('ov'),box=$('box');let primary=null;
function showOv(html,btns){
  box.innerHTML=html;const wrap=document.createElement('div');wrap.className='btns';
  btns.forEach(([t,fn,ghost],i)=>{const b=document.createElement('button');b.textContent=t;if(ghost)b.className='ghost';b.onclick=()=>{ac();fn();};wrap.appendChild(b);if(i===0)primary=b;});
  box.appendChild(wrap);ov.hidden=false;setTimeout(()=>primary&&primary.focus(),30);
}
function hideOv(){ov.hidden=true;primary=null;}
function heroCanvas(withCushion){

  if(withCushion){g.fillStyle='#8a3b4a';g.fillRect(6,15,28,7);g.fillStyle='#c2566b';g.fillRect(7,14,26,5);g.fillStyle='#e48aa0';g.fillRect(9,15,4,1);}

/* ---------- 온라인 대전 (Firebase Realtime Database) ---------- */
const NET_DUR=90;
const NET={on:false,role:null,host:false,code:'',db:null,room:null,
  remoteT:{x:0,y:0,f:1,m:0,c:0,s:-1},remote:{x:0,y:0,face:1,anim:0,moving:false},
  me:{x:0,y:0,face:1,anim:0,moving:false,path:null,pi:0},
  state:null,sendT:0,stateT:0,spawnSeen:-1,bite:false,dash:0,dashCd:0,shoutCd:0,treats:3,round:-1,prev:null,subs:[],chewT:0};
let HS=null;
const other=()=>NET.role==='human'?'dog':'human';
const fbReady=()=>typeof firebase!=='undefined'&&!!firebase.database;
const fbConfigured=()=>!!FIREBASE_CONFIG.databaseURL;
function db(){if(!NET.db){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);NET.db=firebase.database();}return NET.db;}
function sub(ref,evt,cb){ref.on(evt,cb);NET.subs.push([ref,evt,cb]);}

function onlineMenu(msg=''){

  if(!fbReady()){showOv(`<h2>둘이 하기</h2><p>온라인 대전은 GitHub Pages 같은 곳에 올린 파일에서만 된다.<br>이 화면에서는 파이어베이스에 연결할 수 없다.</p>`,[['돌아가기',title]]);return;}
  if(!fbConfigured()){showOv(`<h2>둘이 하기</h2><p>파일 맨 위 <b>FIREBASE_CONFIG</b>에<br>databaseURL을 넣어야 한다.</p>`,[['돌아가기',title]]);return;}
  showOv(`<h2>둘이 하기</h2><p class="sub">한 명은 사람 한 명은 래오</p>
  <div class="role-pick"><label><input type="radio" name="role" value="human" checked><span>사람<small>아침까지 지키기</small></span></label><label><input type="radio" name="role" value="dog"><span>래오<small>3개 물어뜯기</small></span></label></div>
  <input id="codeIn" class="code-in" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" autocomplete="off">
  ${msg?`<p style="color:var(--danger)">${msg}</p>`:''}
  <div class="rules"><b>방 만들기</b>는 위에서 고른 역할로 방을 연다.<br><b>방 들어가기</b>는 번호를 넣으면 남은 역할을 맡는다.<br>사람: <b>SPACE</b> 안돼! · <b>E</b> 간식 · 래오에게 닿으면 쫓아냄<br>래오: 물건 옆에서 <b>SPACE</b> 꾹 = 물기 · <b>E</b> 돌진 · 간식은 못 참는다</div>`,
  [['방 만들기',createRoom],['방 들어가기',joinRoom,true],['돌아가기',title,true]]);
}
async function createRoom(){
  try{
    const role=(document.querySelector('input[name=role]:checked')||{}).value||'human';
    showOv(`<h2>방 여는 중...</h2>`,[]);
    let code='';for(let i=0;i<10;i++){code=String(1000+Math.floor(Math.random()*9000));const s=await db().ref('leo/'+code+'/meta').get();if(!s.exists())break;}
    NET.code=code;NET.role=role;NET.host=true;NET.room=db().ref('leo/'+code);HS=null;
    await NET.room.child('meta').set({hostRole:role,guest:false,at:firebase.database.ServerValue.TIMESTAMP});
    NET.room.onDisconnect().remove();
    showOv(`<h2>방 번호</h2><div class="code">${code}</div><p>친구에게 이 번호를 알려 줘.<br>친구가 들어오면 바로 시작한다.</p><p class="sub">나는 ${role==='human'?'사람':'래오'}</p>`,[['나가기',leaveNet,true]]);
    sub(NET.room.child('meta/guest'),'value',s=>{
      if(s.val()===true){if(G.mode==='lobby')setTimeout(hostStart,600);}
      else if(G.mode==='net'||G.mode==='netEnd')netGone('친구가 나갔다');
    });
    sub(NET.room.child('pos/'+other()),'value',s=>gotRemote(s.val()));
    sub(NET.room.child('acts'),'child_added',s=>{applyAct(s.val());s.ref.remove();});
  }catch(err){onlineMenu('연결 실패: '+(err&&err.message||err));}
}
async function joinRoom(){
  const code=(($('codeIn')||{}).value||'').trim();
  if(!/^\d{4}$/.test(code))return onlineMenu('방 번호 4자리를 넣어 줘');
  try{
    const room=db().ref('leo/'+code);const m=(await room.child('meta').get()).val();
    if(!m)return onlineMenu('그런 방이 없다');
    if(m.guest)return onlineMenu('이미 둘이 들어간 방이다');
    NET.code=code;NET.room=room;NET.host=false;NET.role=m.hostRole==='human'?'dog':'human';NET.round=-1;NET.state=null;
    await room.child('meta/guest').set(true);
    room.child('meta/guest').onDisconnect().set(false);room.child('pos/'+NET.role).onDisconnect().remove();
    sub(room.child('meta'),'value',s=>{if(!s.exists()&&NET.room)netGone('방이 닫혔다');});
    sub(room.child('pos/'+other()),'value',s=>gotRemote(s.val()));
    sub(room.child('state'),'value',s=>gotState(s.val()));
    showOv(`<h2>들어왔다!</h2><p>나는 <b style="color:var(--lamp)">${NET.role==='human'?'사람':'래오'}</b></p><p class="sub">곧 시작한다...</p>`,[['나가기',leaveNet,true]]);
  }catch(err){onlineMenu('연결 실패: '+(err&&err.message||err));}
}
function gotRemote(v){if(!v)return;Object.assign(NET.remoteT,v);}
function gotState(st){
  if(!st)return;NET.state=st;
  if(st.round!==NET.round&&!st.result)netBegin(st.round);
}
function hostStart(){
  const r=(HS?HS.round:0)+1;
  HS={round:r,t:0,items:ITEMS.map(()=>100),treats:[],dog:{phase:'out',timer:2.5,entry:-1,spawn:0},broken:0,shoo:0,result:null,sh:{n:0,x:0,y:0}};
  netBegin(r);sendState();
}
function netBegin(round){
  NET.on=true;NET.round=round;NET.prev=null;NET.spawnSeen=-1;NET.treats=3;NET.dash=0;NET.dashCd=0;NET.shoutCd=0;NET.bite=false;
  Object.assign(NET.me,NET.role==='human'?{x:7*T+8,y:7*T+12}:{x:-50,y:-50},{face:1,anim:0,moving:false,path:null});
  G.items=ITEMS.map(d=>({...d,hp:100,dead:false}));G.floorTreats=[];G.parts=[];G.texts=[];G.rings=[];G.broken=0;G.shoo=0;G.t=0;
  G.dogs=[{...DOGS[0],state:'away',x:-50,y:-50,face:1,anim:0,entry:0,target:null}];
  $('bShout').textContent=NET.role==='dog'?'물기':'안돼!';$('bTreat').textContent=NET.role==='dog'?'돌진':'간식';
  G.mode='net';hideOv();
  toast(NET.role==='human'?'아침 6시까지 물건을 지켜라!':'곧 들어갈 수 있다. 물건 3개를 노려라!');
}
function sendState(){
  if(!NET.room||!HS)return;
  NET.room.child('state').set({round:HS.round,t:Math.round(HS.t*10)/10,items:HS.items.map(v=>Math.max(0,Math.ceil(v))),
    treats:HS.treats.length?HS.treats:null,dog:HS.dog,broken:HS.broken,shoo:HS.shoo,result:HS.result||null,sh:HS.sh});
}
function applyAct(a){
  if(!HS||!a||HS.result)return;
  const hu=NET.role==='human'?NET.me:NET.remoteT,dg=NET.role==='dog'?NET.me:NET.remoteT,D=HS.dog;
  if(a.a==='shout'){
    HS.sh={n:HS.sh.n+1,x:hu.x,y:hu.y-6};
    if(['in','eat'].includes(D.phase)&&dogValid()&&Math.hypot(dg.x-hu.x,dg.y-hu.y)<46){D.phase='stun';D.timer=1.5;}
  }
  if(a.a==='treat'&&walk(a.x,a.y)&&MAP[a.y][a.x]==='.'&&!HS.treats.some(([x,y])=>x===a.x&&y===a.y))HS.treats.push([a.x,a.y]);
}
const dogValid=()=>(NET.role==='dog'?NET.spawnSeen:NET.remoteT.s)===HS.dog.spawn;
function nearItemIdx(p,alive){let best=-1,bd=13;ITEMS.forEach((it,i)=>{if(!alive(i))return;const d=Math.hypot(it.x*T+8-p.x,it.y*T+11-p.y);if(d<bd){bd=d;best=i;}});return best;}
function hostTick(dt){
  if(HS.result)return;
  HS.t+=dt;
  const hu=NET.role==='human'?NET.me:NET.remoteT,dg=NET.role==='dog'?NET.me:NET.remoteT,bite=NET.role==='dog'?NET.bite:!!NET.remoteT.c,D=HS.dog;
  if(D.phase==='out'){D.timer-=dt;if(D.timer<=0){let ei;do{ei=Math.floor(Math.random()*4);}while(ei===D.entry);D.entry=ei;D.phase='warn';D.timer=1.2;D.spawn++;}}
  else if(D.phase==='warn'){D.timer-=dt;if(D.timer<=0)D.phase='in';}
  else if(D.phase==='stun'||D.phase==='eat'){D.timer-=dt;if(D.timer<=0)D.phase='in';}
  if(['in','stun','eat'].includes(D.phase)&&dogValid()){
    if(Math.hypot(hu.x-dg.x,(hu.y-5)-(dg.y-3))<13){D.phase='out';D.timer=3;HS.shoo++;}
    else if(D.phase==='in'){
      const ti=HS.treats.findIndex(([x,y])=>Math.hypot(x*T+8-dg.x,y*T+11-dg.y)<11);
      if(ti>=0){HS.treats.splice(ti,1);D.phase='eat';D.timer=2.5;}
      else if(bite){const i=nearItemIdx(dg,i=>HS.items[i]>0);
        if(i>=0){HS.items[i]-=24*dt;if(HS.items[i]<=0){HS.items[i]=0;HS.broken++;if(HS.broken>=3)HS.result='dog';}}}
    }
  }
  if(!HS.result&&HS.t>=NET_DUR)HS.result='human';
  NET.stateT-=dt;if(NET.stateT<=0||HS.result){NET.stateT=.08;sendState();}
}
function netUpdate(dt){
  const st=NET.host?HS:NET.state;if(!st)return;
  const r=NET.remote,t=NET.remoteT,k=Math.min(1,dt*14);
  if(Math.hypot(t.x-r.x,t.y-r.y)>40){r.x=t.x;r.y=t.y;}else{r.x+=(t.x-r.x)*k;r.y+=(t.y-r.y)*k;}
  r.face=t.f||1;r.moving=!!t.m;if(r.moving)r.anim+=dt*9;
  const me=NET.me;let canMove=G.mode==='net';
  if(NET.role==='dog'){
    if(st.dog.spawn!==NET.spawnSeen&&st.dog.phase!=='out'){const e=ENTRIES[st.dog.entry];me.x=e.ix*T+8;me.y=e.iy*T+11;me.path=null;NET.spawnSeen=st.dog.spawn;}
    canMove=canMove&&st.dog.phase==='in';
  }
  NET.dashCd=Math.max(0,NET.dashCd-dt);NET.dash=Math.max(0,NET.dash-dt);NET.shoutCd=Math.max(0,NET.shoutCd-dt);
  const [mx,my]=inputVec(me,dt);
  if(canMove){const sp=NET.role==='human'?70:(NET.dash>0?150:64);tryMove(me,mx*sp*dt,0);tryMove(me,0,my*sp*dt);}
  else me.moving=false;
  NET.sendT-=dt;
  if(NET.sendT<=0&&NET.room){NET.sendT=.066;NET.room.child('pos/'+NET.role).set({x:Math.round(me.x*10)/10,y:Math.round(me.y*10)/10,f:me.face,m:me.moving?1:0,c:NET.bite?1:0,s:NET.spawnSeen});}
  if(NET.host&&G.mode==='net')hostTick(dt);
  netToG(st);transitions(st);
  const d=G.dogs[0];
  if(d.state==='chew'){const it=d.target.ref;if(Math.random()<dt*10)G.parts.push({x:it.x*T+8+rand(-4,4),y:it.y*T+8,vx:rand(-25,25),vy:rand(-40,-10),life:.6,c:it.fluff});
    NET.chewT-=dt;if(NET.chewT<=0){SFX.chew();NET.chewT=.18;}}
  fx(dt);
}
function netToG(st){
  G.items.forEach((it,i)=>{const v=(st.items||[])[i];it.hp=v==null?0:v;it.dead=it.hp<=0;});
  G.floorTreats=(st.treats||[]).map(([x,y])=>({x,y}));
  G.broken=st.broken||0;G.t=st.t||0;G.shoo=st.shoo||0;
  const hu=NET.role==='human'?NET.me:NET.remote,dg=NET.role==='dog'?NET.me:NET.remote;
  Object.assign(G.player,{x:hu.x,y:hu.y,face:hu.face,anim:hu.anim,moving:hu.moving,path:NET.role==='human'?NET.me.path:null});
  const d=G.dogs[0],D=st.dog;d.entry=D.entry;d.face=dg.face;d.anim=dg.anim;d.target=null;
  if(D.phase==='out')d.state='away';
  else if(D.phase==='warn'){const e=ENTRIES[D.entry];d.state='warn';d.x=e.bx*T+8;d.y=e.by*T+11;}
  else{d.x=dg.x;d.y=dg.y;d.state=D.phase==='in'?'walk':D.phase;
    const biting=NET.role==='dog'?NET.bite:!!NET.remoteT.c;
    if(D.phase==='in'&&biting){const i=nearItemIdx(dg,i=>!G.items[i].dead);if(i>=0){d.state='chew';d.target={type:'item',ref:G.items[i]};}}}
}
function transitions(st){
  const p=NET.prev,D=st.dog,d=G.dogs[0];
  if(p){
    if(p.phase!==D.phase){
      if(D.phase==='warn'){SFX.bark();toast(NET.role==='human'?`${ENTRIES[D.entry].name}에서 래오 소리가 난다!`:`${ENTRIES[D.entry].name}으로 들어간다!`);}
      if(D.phase==='in'&&p.phase==='warn')floatText(d.x,d.y-12,'멍!','#ffc96b');
      if(D.phase==='out'&&p.phase!=='warn'){SFX.shoo();floatText(NET.role==='dog'?NET.me.x:NET.remote.x,(NET.role==='dog'?NET.me.y:NET.remote.y)-12,'깨갱!','#7fd49a');if(NET.role==='dog')toast('쫓겨났다! 3초 뒤 다시 들어간다');}
      if(D.phase==='stun'){floatText(d.x,d.y-12,'낑?','#cfe0ff');if(NET.role==='dog')SFX.shout();}
      if(D.phase==='eat'){SFX.treat();floatText(d.x,d.y-12,'냠냠','#f6ecd2');}
    }
    (st.items||[]).forEach((v,i)=>{if(v<=0&&p.items[i]>0){SFX.broke();const it=ITEMS[i];floatText(it.x*T+8,it.y*T,it.name+' 망가짐!','#ff6b5a');}});
    if(st.sh&&st.sh.n!==p.sh&&NET.role==='dog')G.rings.push({x:st.sh.x,y:st.sh.y,r:4,life:.45});
  }
  NET.prev={phase:D.phase,items:(st.items||[]).slice(),sh:st.sh?st.sh.n:0};
  if(st.result&&G.mode==='net')netEnd(st.result);
}
function netEnd(result){
  G.mode='netEnd';NET.bite=false;
  const win=result===NET.role;win?SFX.win():SFX.lose();
  const head=result==='human'?'아침이 밝았다! 사람 승리':'래오의 침투 성공! 래오 승리';
  showOv(`<h2 style="color:${win?'var(--lamp)':'var(--danger)'}">${win?'이겼다!':'졌다...'}</h2><p>${head}</p>
  <div class="stats"><div><span class="lbl">쫓아냄</span><span class="v">${G.shoo}</span></div><div><span class="lbl">망가진 물건</span><span class="v">${G.broken}</span></div></div>
  ${NET.host?'':'<p class="sub">방장이 다시 시작하면 바로 시작한다</p>'}`,
  NET.host?[['다시 하기',hostStart],['나가기',leaveNet,true]]:[['나가기',leaveNet,true]]);
}
function cleanupNet(){
  NET.subs.forEach(([ref,evt,cb])=>ref.off(evt,cb));NET.subs=[];
  NET.on=false;NET.state=null;HS=null;NET.round=-1;
  $('bShout').textContent='안돼!';$('bTreat').textContent='간식';
}
function leaveNet(){
  const room=NET.room;
  if(room){if(NET.host)room.remove();else{room.child('meta/guest').set(false);room.child('pos/'+NET.role).remove();}}
  NET.room=null;cleanupNet();title();
}
function netGone(msg){
  NET.room=null;cleanupNet();G.mode='lobby';
  showOv(`<h2>연결 끝</h2><p>${msg}</p>`,[['처음으로',title]]);
}
function netShout(){
  if(NET.shoutCd>0)return;NET.shoutCd=2.5;SFX.shout();
  const me=NET.me;floatText(me.x,me.y-18,'안돼!','#ff6b5a');G.rings.push({x:me.x,y:me.y-6,r:4,life:.45});
  if(NET.host)applyAct({a:'shout'});else NET.room.child('acts').push({a:'shout'});
}
function netTreat(){
  const me=NET.me,tx=Math.floor(me.x/T),ty=Math.floor((me.y-2)/T);
  if(NET.treats<=0){toast('간식이 다 떨어졌다');return;}
  if(!(MAP[ty]&&MAP[ty][tx]==='.'))return;
  NET.treats--;SFX.treat();floatText(me.x,me.y-18,'간식!','#f6ecd2');
  const a={a:'treat',x:tx,y:ty};if(NET.host)applyAct(a);else NET.room.child('acts').push(a);
}
function netDash(){if(NET.dashCd>0)return;NET.dash=.45;NET.dashCd=3;floatText(NET.me.x,NET.me.y-14,'후다닥','#ffc96b');tone(300,.12,'triangle',.05,300);}

/* ---------- 입력 ---------- */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  ac();
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(KEYMAP[e.code]&&!typing){keys[KEYMAP[e.code]]=true;if(G.mode==='play'||G.mode==='net')e.preventDefault();}
  if(G.mode==='net'){
    if(e.code==='Space'){e.preventDefault();if(NET.role==='human'){if(!e.repeat)netShout();}else NET.bite=true;}
    if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight'){if(e.repeat)return;NET.role==='human'?netTreat():netDash();}
    return;
  }
  if(e.code==='Space'){if(G.mode==='play'){e.preventDefault();shout();}}
  if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight')throwTreat();
  if(e.code==='KeyP'||e.code==='Escape')pause();
  if(e.code==='Enter'&&!ov.hidden&&primary&&document.activeElement!==primary&&!typing){e.preventDefault();primary.click();}
});
addEventListener('keyup',e=>{if(KEYMAP[e.code])keys[KEYMAP[e.code]]=false;if(e.code==='Space')NET.bite=false;});
addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('touchstart',()=>document.body.classList.add('touch'),{passive:true});
// 조이스틱
const joyEl=$('joy'),knob=$('knob');
function joyMove(e){
  const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-14;
  let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  const nx=dx/R,ny=dy/R;const m=Math.hypot(nx,ny);
  if(m<.2){joy.x=0;joy.y=0;}else{joy.x=nx;joy.y=ny;}
}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();ac();joy.on=true;try{joyEl.setPointerCapture(e.pointerId)}catch(_){}joyMove(e);});
joyEl.addEventListener('pointermove',e=>{if(joy.on)joyMove(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joyEl.addEventListener(t,()=>{joy.on=false;joy.x=0;joy.y=0;knob.style.transform='';}));
// 화면을 누르면 그 자리로 걸어가기
cv.addEventListener('pointerdown',e=>{
  if(G.mode!=='play'&&G.mode!=='net')return;e.preventDefault();ac();
  const r=cv.getBoundingClientRect(),ix=(e.clientX-r.left)/r.width*VW,iy=(e.clientY-r.top)/r.height*VH;
  let tx=Math.floor(ix/T),ty=Math.floor(iy/T);
  if(!(MAP[ty]&&MAP[ty][tx]==='.')){ // 벽이나 가구를 눌렀으면 가장 가까운 바닥으로
    let best=null,bd=9;for(let y=ty-1;y<=ty+1;y++)for(let x=tx-1;x<=tx+1;x++)if(MAP[y]&&MAP[y][x]==='.'){const d=Math.hypot(x+.5-ix/T,y+.5-iy/T);if(d<bd){bd=d;best={x,y};}}
    if(!best)return;tx=best.x;ty=best.y;}
  const p=G.mode==='net'?NET.me:G.player,path=findPath(Math.floor(p.x/T),Math.floor((p.y-1)/T),tx,ty);
  if(path){p.path=path;p.pi=path.length>1?1:0;}
});
$('bShout').addEventListener('pointerdown',e=>{e.preventDefault();ac();
  if(G.mode==='net'){if(NET.role==='human')netShout();else{NET.bite=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}}else shout();});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>$('bShout').addEventListener(t,()=>{NET.bite=false;}));
$('bTreat').addEventListener('pointerdown',e=>{e.preventDefault();ac();
  if(G.mode==='net'){NET.role==='human'?netTreat():netDash();}else throwTreat();});

/* ---------- 루프 ---------- */
startDay(0);G.mode='title';
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.hidden=true;}
  if(G.mode==='net'||G.mode==='netEnd')netUpdate(dt);else update(dt);
  draw();hud();requestAnimationFrame(loop);
}
title();requestAnimationFrame(loop);
})();
</script>
